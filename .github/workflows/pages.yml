# Optional: deploy the site via GitHub Actions instead of the default
# "Deploy from a branch" setting.
#
# You only need ONE of these two approaches:
#   * Default (simplest): Settings -> Pages -> Source = "Deploy from a branch"
#     (branch: main, folder: / root). Then this workflow is unused and you can
#     delete it.
#   * Actions: Settings -> Pages -> Source = "GitHub Actions". Then this workflow
#     publishes on every push to main.
#
# It uploads the repository root as-is (the site is pre-built and committed, so
# there is no build step).
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
