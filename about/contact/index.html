<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Vertex Society</title>
<meta name="description" content="Fellows Society For Exceptionally And Profoundly Gifted">
<link rel="icon" href="/assets/img/logo.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div data-include="/assets/partials/header.html"></div>
<section class="banner" style="background-image:url(/assets/img/skyline.jpg)">
  <div class="container banner-inner">
    <p class="kicker">Vertex Society</p>
    <h1>Contact</h1>
  </div>
</section>
<main id="main">
<div class="prose">
<p>Use the form below to send any comments or inquiries that you have.<br>
For membership application, please go to <a href="/admission/application/">this page</a> instead.</p>
    <!-- Google Form field mapping — replace each entry.REPLACE_* with the real entry.<id> from your Google Form:
         'Name'                                        -> entry.REPLACE_contact_name
         'Email'                                       -> entry.REPLACE_contact_email
         'Your Message'                                -> entry.REPLACE_contact_your_message
    -->
    <form class="vx-form" action="GOOGLE_FORM_ACTION_CONTACT" method="POST"
          target="gform_target_contact" onsubmit="this.dataset.sent='1';">
    <div class="field">
      <label for="f_contact_name">Name <span class="req">*</span></label>
      <input id="f_contact_name" type="text" name="entry.REPLACE_contact_name" required>
    </div>
    <div class="field">
      <label for="f_contact_email">Email <span class="req">*</span></label>
      <input id="f_contact_email" type="email" name="entry.REPLACE_contact_email" required>
    </div>
    <div class="field">
      <label for="f_contact_your_message">Your Message <span class="req">*</span></label>
      <textarea id="f_contact_your_message" name="entry.REPLACE_contact_your_message" rows="5" required></textarea>
    </div>
      <div class="field">
        <button type="submit">Submit</button>
      </div>
      <p class="form-note"><span class="req">*</span> required</p>
    </form>
    <iframe name="gform_target_contact" style="display:none" title="hidden"
            onload="var f=document.querySelector('form[target=&quot;gform_target_contact&quot;]');
                    if(f&&f.dataset.sent){f.style.display='none';
                    document.getElementById('thanks_contact').style.display='block';}"></iframe>
    <div id="thanks_contact" class="form-thanks" style="display:none">
      <h2>Thank you</h2>
      <p>Your submission has been received. You will be contacted shortly.</p>
    </div>

</div>
</main>
<div data-include="/assets/partials/footer.html"></div>
<script src="/assets/js/include.js" defer></script>
</body>
</html>
